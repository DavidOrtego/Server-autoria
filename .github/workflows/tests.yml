name: Node.js CI (Tests)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Environment Variables
      run: |
        echo "PORT=3000" >> .env
        echo "DATABASE_HOST=127.0.0.1" >> .env
        echo "DATABASE_PORT=3306" >> .env
        echo "DATABASE_USER=root" >> .env
        echo "DATABASE_PASS=password" >> .env
        echo "DATABASE_NAME=vives_db" >> .env
        echo "JWT_SECRET=token-secreto" >> .env
        
        echo "MYSQL_ROOT_PASSWORD=password" >> .env
        echo "MYSQL_DATABASE=vives_db" >> .env
        echo "MYSQL_USER=vives_user" >> .env
        echo "MYSQL_PASSWORD=password" >> .env

    - name: Start Database with Docker Compose
      run: docker compose up -d

    - name: Wait for Database to initialize
      run: |
        echo "Waiting for MariaDB to accept connections..."
        timeout 60s bash -c 'until docker exec vives_db_container mysqladmin ping -h localhost -uroot -ppassword --silent; do sleep 2; done'
        echo "MariaDB is up! Waiting a few extra seconds to ensure init scripts (seeds/procedures) are fully applied..."
        sleep 10

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      run: npm test

    - name: Start API Server in background
      run: npm start &

    - name: Install Newman and Wait-on
      run: npm install -g newman wait-on

    - name: Wait for API to be ready
      run: wait-on tcp:127.0.0.1:3000

    - name: Run Postman Tests
      run: newman run VivesHouseAPI_PostmanCollection.json --env-var "base_url=http://127.0.0.1:3000/api"

