name: Node.js CI (Tests)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Environment Variables
      run: |
        echo "PORT=3000" >> .env
        echo "DATABASE_HOST=127.0.0.1" >> .env
        echo "DATABASE_PORT=3306" >> .env
        echo "DATABASE_USER=user_vives" >> .env
        echo "DATABASE_PASS=password_vives" >> .env
        echo "DATABASE_NAME=vives_db" >> .env
        echo "JWT_SECRET=token-secreto" >> .env
        
        echo "MYSQL_ROOT_PASSWORD=password" >> .env
        echo "MYSQL_DATABASE=vives_db" >> .env
        echo "MYSQL_USER=user_vives" >> .env
        echo "MYSQL_PASSWORD=password_vives" >> .env

        # Copiamos el archivo de configuración base
        cp config.local.yaml.example config.local.yaml

    - name: Start Database with Docker Compose
      run: docker compose up -d

    - name: Wait for Database to initialize
      run: |
        echo "Waiting for MariaDB to accept connections..."
        # Usamos el cliente mysqladmin que viene preinstalado en la máquina de GitHub Actions
        timeout 60s bash -c 'until mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -ppassword --silent; do sleep 2; done'
        echo "MariaDB is up! Waiting 15 extra seconds to ensure init scripts (seeds/procedures) are fully applied..."
        sleep 15

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      run: npm test

    - name: Start API Server in background
      run: npm start &

    - name: Install Newman and Wait-on
      run: npm install -g newman wait-on

    - name: Wait for API to be ready
      run: wait-on tcp:127.0.0.1:3000

    - name: Run Postman Tests
      run: newman run VivesHouseAPI_PostmanCollection.json --env-var "base_url=http://127.0.0.1:3000/api"