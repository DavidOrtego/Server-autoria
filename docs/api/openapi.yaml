openapi: 3.0.0
info:
  title: Vives House API (Simplificada)
  description: API para la gestión de tareas y gastos en casas compartidas.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Servidor de desarrollo

paths:
  /auth/register:
    post:
      summary: Registrar un nuevo usuario
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Juan Perez
                email:
                  type: string
                  format: email
                  example: juan@example.com
                password:
                  type: string
                  minLength: 8
                  example: password123
                rol:
                  type: string
                  enum: [admin, member]
                  default: member
      responses:
        '201':
          description: Usuario registrado correctamente
        '400':
          description: Errores de validación
        '409':
          description: El email ya está en uso

  /auth/login:
    post:
      summary: Iniciar sesión
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: juan@example.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Login exitoso
        '401':
          description: Credenciales incorrectas
        '404':
          description: Usuario no encontrado

  /auth/me:
    get:
      summary: Obtener datos del usuario autenticado
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario obtenidos correctamente
        '401':
          description: No autorizado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
